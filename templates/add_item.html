{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="glass-card p-5">
            <h2 class="mb-4 text-center">
                {% if type == 'lost' %}Report a Lost Item{% else %}Report a Found Item{% endif %}
            </h2>
            <form method="POST" enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Item Name</label>
                        <input type="text" class="form-control" name="name" required placeholder="e.g. Blue Backpack">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Category</label>
                        <select class="form-select" name="category">
                            <option value="Electronics">Electronics</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Keys/Cards">Keys / ID Cards</option>
                            <option value="Books">Books / Notes</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Description</label>
                    <textarea class="form-control" name="description" rows="3" required placeholder="Any specific details to identify the item..."></textarea>
                </div>
                
                <div class="row g-3">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Location</label>
                        <input type="text" class="form-control" name="location" required placeholder="Where was it {% if type == 'lost' %}lost{% else %}found{% endif %}?">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Date</label>
                        <input type="date" class="form-control" name="date" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Image (Optional)</label>
                    <input type="file" class="form-control" name="image" accept="image/*">
                </div>
                
                <div class="text-center">
                    <button type="submit" class="btn {% if type == 'lost' %}btn-secondary-custom{% else %}btn-primary-custom{% endif %} btn-lg w-50">
                        Submit Item
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
